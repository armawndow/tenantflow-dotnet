name: tenantflow-build

on:
  push:
    paths:
      - "samples/tenantflow-dotnet/**"
  pull_request:
    paths:
      - "samples/tenantflow-dotnet/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/tenantflow-dotnet
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: samples/tenantflow-dotnet/global.json
      - name: Restore
        run: dotnet restore TenantFlow.slnx --locked-mode
      - name: Build
        run: dotnet build TenantFlow.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test TenantFlow.slnx --configuration Release --no-build --logger "console;verbosity=minimal"
