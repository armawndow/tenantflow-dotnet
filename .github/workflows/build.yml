name: tenantflow-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore TenantFlow.slnx --locked-mode
      - name: Build
        run: dotnet build TenantFlow.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test TenantFlow.slnx --configuration Release --no-build --logger "console;verbosity=minimal"
